<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elanselvan S | Angular 21 Front-End Developer</title>
    
    <meta name="description" content="Portfolio of Elanselvan S — Angular 21 Front-End Developer with 4+ years of experience specializing in Angular 21, TypeScript, RxJS, Signals, RESTful APIs, and scalable SaaS platforms." />
    <meta name="keywords" content="Elanselvan, Angular 21 Developer, Angular 21, Frontend Developer, BizFlow, ConnectSecure, Software Developer, TypeScript, RxJS, Signals, Web Development, Portfolio" />
    <meta name="author" content="Elanselvan S" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://elanselvan.netlify.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elanselvan.netlify.app/" />
    <meta property="og:title" content="Elanselvan S | Angular 21 Front-End Developer" />
    <meta property="og:description" content="Angular 21 Front-End Developer with 4+ years of experience building scalable, high-performance web applications and SaaS platforms." />
    <meta property="og:image" content="https://elanselvan.netlify.app/assets/logo-dark.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://elanselvan.netlify.app/" />
    <meta name="twitter:title" content="Elanselvan S | Angular 21 Front-End Developer" />
    <meta name="twitter:description" content="Angular 21 Front-End Developer with 4+ years of experience building scalable, high-performance web applications and SaaS platforms." />
    <meta name="twitter:image" content="https://elanselvan.netlify.app/assets/logo-dark.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0a0f1d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

    <!-- Base URL for Angular routing -->
    <base href="/" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Immediate Theme Initialization to prevent Flash of Unstyled Theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark) || !saved) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* Fallback inline critical styles for initial paint */
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      .app-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #060a12;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .preloader-spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-navy-950 dark:text-slate-100 selection:bg-primary-500/30 selection:text-primary-300">
    <app-root>
      <!-- Non-blocking preloader replaced immediately on Angular mount -->
      <div class="app-preloader" aria-label="Loading Elanselvan's Portfolio">
        <div class="preloader-spinner"></div>
        <p style="font-size: 14px; letter-spacing: 0.05em; font-weight: 500;">Loading portfolio...</p>
      </div>
    </app-root>

    <!-- Hidden form for Netlify form crawler detection during build -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
